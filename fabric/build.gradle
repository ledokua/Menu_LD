// Fabric glue: the client entrypoint, screen/connection events and the Platform service.
plugins {
    id 'fabric-loom'
}

repositories {
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    // Dev runtime only: Mod Menu adds its own "Mods" button to the title screen, the case the layout's
    // "mods" widget id exists for. Nothing of it ends up in the release jar.
    modLocalRuntime("com.terraformersmc:modmenu:11.0.3") { transitive = false }

    implementation project(path: ':common', configuration: 'namedElements')
}

loom {
    runs {
        client { ideConfigGenerated = true; runDir = "run" }
        server { ideConfigGenerated = true; runDir = "run-server" }
    }
}

def commonSourceSet = project(':common').sourceSets.main

processResources {
    from commonSourceSet.resources
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "loader_version", rootProject.loader_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": rootProject.minecraft_version,
                "loader_version": rootProject.loader_version
    }
}

jar {
    from commonSourceSet.output.classesDirs
    from(rootProject.file("LICENSE.txt")) { rename { "${it}_${rootProject.archives_base_name}" } }
}

sourcesJar {
    from commonSourceSet.allSource
}
