// Menu_LD for Minecraft 26.1.2, NeoForge only. Same packages and class names as the 1.21.1 MultiLoader
// build in ../../ (common/ + neoforge/), so changes can be carried over file by file.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // ModDevGradle runs ignore Gradle's --args: -PquickPlay=<world>, -Pusername=<name>.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            if (project.hasProperty('username')) {
                programArguments.addAll('--username', project.property('username').toString())
            }
        }
    }

    mods {
        menu_ld {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def props = [version: version, minecraft_version: minecraft_version, neoforge_version: neoforge_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    from(rootProject.file('../../LICENSE.txt')) { rename { "${it}_Menu_LD" } }
}
