modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "menu_ld"
version = "${version}"
displayName = "Menu_LD"
authors = "LeDok"
description = '''Lightweight title screen and loading screen customization from one config file: background images and GIFs, restyled and moved buttons, extra link and join-server buttons, menu music.'''

[[mixins]]
config = "menu_ld.mixins.json"

[[dependencies.menu_ld]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,27)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.menu_ld]]
modId = "minecraft"
type = "required"
versionRange = "[26.1,26.2)"
ordering = "NONE"
side = "CLIENT"

# Both mods restyle the same title screen.
[[dependencies.menu_ld]]
modId = "fancymenu"
type = "discouraged"
reason = "Menu_LD replaces FancyMenu; keep only one of them."
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
